# Small, reproducible defaults for Apple Silicon smoke tests.  Increase only
# after `python main.py --mode train --debug` succeeds.
model:
  path: models/TinyLlama-1.1B-Chat-v1.0
training:
  c4_samples: 20
  max_length: 128
  batch_size: 1
  epochs: 2
  learning_rate: 0.0001
  enn_hidden_dim: 512
  epistemic_index_dim: 6
  num_epistemic_samples: 3
  checkpoint_every: 1
dola:
  alpha: 1.0
  mature_layer: null  # null selects TinyLlama's final transformer block
evaluation:
  truthfulqa_questions: 10
  top_k_tokens: 10
paths:
  results: results
  checkpoints: checkpoints
